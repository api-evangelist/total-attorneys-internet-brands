name: Total Attorneys (Internet Brands)
description: 'Total Attorneys is a legal marketing and lead-generation brand owned by Internet Brands.
  Originally a legal practice-management and client-intake SaaS backed by Bain Capital Ventures, the
  service was folded into the Martindale-Avvo network, and as of April 1, 2019 its attorney lead-generation
  offering transitioned to the Martindale-Nolo Pay Per Lead program. The totalattorneys.com site today
  markets pay-per-lead attorney marketing across practice areas such as bankruptcy, criminal defense,
  DUI/DWI, divorce, and personal injury. No public developer program or API is currently published.'
